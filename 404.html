<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to CipherShield...</title>
    <script>
      // Automatically redirect non-hash routes to hash routes on GitHub Pages
      var path = window.location.pathname;
      var repo = '/Prodigy_FS_01';
      var subPath = path.startsWith(repo) ? path.substring(repo.length) : path;
      if (subPath.startsWith('/')) subPath = subPath.substring(1);

      var search = window.location.search || '';
      var hash = window.location.hash || '';

      var targetUrl = window.location.origin + repo + '/#' + (subPath ? '/' + subPath : '') + search + hash;
      window.location.replace(targetUrl);
    </script>
  </head>
  <body style="background: #070b14; color: #38bdf8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="margin-bottom: 8px;">🛡️ CipherShield IAM</h2>
      <p style="color: #94a3b8;">Redirecting to secure portal...</p>
      <a id="link" href="/Prodigy_FS_01/" style="color: #38bdf8; text-decoration: underline;">Click here if not redirected automatically</a>
    </div>
    <script>
      document.getElementById('link').href = targetUrl;
    </script>
  </body>
</html>
